version: 2
updates:
  # No npm updates: the devDependencies mirror the versions microsoft/playwright pins for
  # packages/extension (vite, @vitejs/plugin-react, react, typescript 6). Bumps ahead of upstream
  # broke the build on day one (TypeScript 7 removed moduleResolution node10). Bump them by hand
  # when upstream does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
